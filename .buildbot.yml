actions:
  - name: Prepare
    # std: 'qmake -r'
    # msvc: 'qmake -r'
    # mingw: 'qmake -r'
    qbs:
      commands: >
        qbs resolve
        --log-time
        --build-directory ./tmp/twofold-build
        --file Twofold-Qt.qbs
        modules.cpp.cxxStandardLibrary:libc++ modules.cpp.staticLibraries:c++,c++abi modules.cpp.linkerVariant:lld
        config:debug
        config:release

  - name: Build and Test Debug
    # std: 'make'
    # msvc: 'nmake.exe'
    # mingw: 'mingw32-make.exe'
    qbs:
      commands: >
        qbs build
        --keep-going
        --log-time
        --build-directory ./tmp/twofold-build
        --file Twofold-Qt.qbs
        --products "Twofold autotest-runner"
        modules.cpp.cxxStandardLibrary:libc++ modules.cpp.staticLibraries:c++,c++abi modules.cpp.linkerVariant:lld
        config:debug


  - name: Build and Test Release
    # std: 'make check'
    # msvc: 'nmake check'
    # mingw: 'mingw32-make.exe check'
    qbs:
      commands: >
        qbs build
        --keep-going
        --log-time
        --build-directory ./tmp/twofold-build
        --file Twofold-Qt.qbs
        --products "Twofold autotest-runner"
        modules.cpp.cxxStandardLibrary:libc++ modules.cpp.staticLibraries:c++,c++abi modules.cpp.linkerVariant:lld
        config:release
